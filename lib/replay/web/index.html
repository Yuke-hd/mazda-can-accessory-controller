<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GVRET LED Emulator</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="emulator" data-phase="connecting" data-live="false">
<h1>GVRET LED Emulator</h1>
<dl class="readout">
<div><dt>State</dt><dd id="status" aria-live="polite">Connecting to local replay…</dd></div>
<div><dt>Replay time</dt><dd id="replay-time">—</dd></div>
</dl>
<div class="strip-frame">
<div id="strip" class="strip" role="img" aria-label="Streamed LED strip"></div>
<p class="stale-marker">No live frame</p>
</div>
<div id="guides" class="guides" aria-label="Strip regions"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
