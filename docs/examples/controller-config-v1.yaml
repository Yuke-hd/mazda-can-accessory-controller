# Host authoring form for the production controller profile.
# Compile with:
#   python3 tools/compile_controller_config.py \
#     docs/examples/controller-config-v1.yaml /tmp/controller-config-v1.json
version: 1

actions:
  - name: left_turn
  - name: right_turn
  - name: hazard
  - name: rpm_fill
  - name: red_zone

rules:
  # A scalar value is accepted as authoring shorthand for the one-key operand.
  - type: state
    action: left_turn
    signal_key: vehicle.turn_state
    comparison: equal
    operand: {choice: left}
    freshness: fresh

  - type: state
    action: right_turn
    signal_key: vehicle.turn_state
    comparison: equal
    operand: {choice: right}
    freshness: fresh

  - type: state
    action: hazard
    signal_key: vehicle.turn_state
    comparison: equal
    operand: {choice: hazard}
    freshness: fresh

  - type: range
    action: rpm_fill
    signal_key: vehicle.engine_rpm
    input:
      from: 0
      to: 6500
    output:
      from: 0
      to: 1
    freshness: fresh_or_unverified

  - type: sampled_state
    action: red_zone
    signal_key: vehicle.engine_rpm
    comparison: greater
    operand: {number: 6000}
    freshness: fresh_or_unverified

outputs:
  - type: led_effect
    action: left_turn
    effect: right_turn
    priority: 100
  - type: led_effect
    action: right_turn
    effect: left_turn
    priority: 100
  - type: led_effect
    action: hazard
    effect: left_turn
    priority: 100
  - type: led_effect
    action: hazard
    effect: right_turn
    priority: 100
  - type: led_fill
    action: rpm_fill
    zone:
      start: 0
      length: 100
      direction: center_out
    color:
      red: 0
      green: 16
      blue: 32
    priority: 50
  - type: led_effect
    action: red_zone
    effect: brake
    priority: 150
