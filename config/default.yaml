# Factory controller profile embedded by the firmware build.
# Compile with:
#   python3 tools/compile_controller_config.py \
#     config/default.yaml \
#     /tmp/controller-config-v1.json
version: 1

actions:
  - name: left_turn
  - name: right_turn
  - name: hazard
  - name: brake

rules:
  # A scalar value is accepted as authoring shorthand for the one-key operand.
  - type: state
    action: left_turn
    signal_key: vehicle.turn_state
    comparison: equal
    operand: {choice: left}
    freshness: fresh

  - type: state
    action: right_turn
    signal_key: vehicle.turn_state
    comparison: equal
    operand: {choice: right}
    freshness: fresh

  - type: state
    action: hazard
    signal_key: vehicle.turn_state
    comparison: equal
    operand: {choice: hazard}
    freshness: fresh

  # Brake freshness is unset; this owner-approved opt-in accepts an
  # unverified observation without promoting it to fresh.
  - type: state
    action: brake
    signal_key: vehicle.brake_pressed
    comparison: equal
    operand: {boolean: true}
    freshness: fresh_or_unverified

outputs:
  - type: led_effect
    action: left_turn
    effect: right_turn
    priority: 100
  - type: led_effect
    action: right_turn
    effect: left_turn
    priority: 100
  - type: led_effect
    action: hazard
    effect: left_turn
    priority: 100
  - type: led_effect
    action: hazard
    effect: right_turn
    priority: 100
  - type: led_solid
    action: brake
    zone:
      start: 35
      length: 30
      direction: start_to_end
    color:
      red: 16
      green: 0
      blue: 0
    priority: 200
